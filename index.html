<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Контрольная работа 8</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<header class="header">
    <div class="container header-container">
        <div class="logo">
            <img src="images/homeWorks.png" alt="logo">
        </div>
    </div>
</header>

<main class="main" id="main">
    <div class="container main-container">
        <div class="main-text-form">
            <div class="main-title" id="main-title">Get your free account</div>
            <div class="main-description">Try homeWorks BUSINESS free for 15 days. Downgrade to Basic (Free Forever) anytime.</div>
            <form action="" id="form" class="form">
                <label class="label" id="label-full-name">
                    <span class="input-title">Full Name</span>
                    <span class="correct correctName">Full name is correct</span>
                    <span class="uncorrect uncorrectName">Full name is uncorrect</span>
                    <input type="text" id="full-name" class="input" placeholder="Ivanov">
                </label>
                <label class="label" id="label-userName">
                    <span class="input-title">Your username</span>
                    <span class="correct correctUserName">Username is correct</span>
                    <span class="uncorrect uncorrectUserName">Username is uncorrect</span>
                    <input type="text" id="username" class="input" placeholder="user1234">
                </label>
                <label class="label" id="label-userNameSignIn" style="display: none">
                    <span class="input-title">Your username SingIn</span>
                    <span class="uncorrect notFoundUserName" >username is not found</span>
                    <input type="text" id="usernameSignIn" class="input" placeholder="user1234">
                </label>
                <label class="label" id="label-email">
                    <span class="input-title">E-mail</span>
                    <span class="correct correctEmail">Email is correct</span>
                    <span class="uncorrect uncorrectEmail">Email is uncorrect</span>
                    <input type="email" id="email" class="input" placeholder="user124@maul.ru">
                </label>
                <label class="label eyes" id="label-password">
                    <span class="input-title">Password</span>
                    <span class="correct correctPassword">Password is correct</span>
                    <span class="uncorrect uncorrectPassword" >Password is uncorrect</span>
                    <input type="password" id="password" class="input" placeholder="User_123&45">
                </label>

                <label class="label eyes" id="label-passwordSingIn" style="display: none">
                    <span class="input-title">Password SignIn</span>
                    <span class="uncorrect invalidPassword">Invalid password</span>
                    <input type="password" id="passwordSignIn" class="input" placeholder="User_123&45">
                </label>
                <label class="label eyes" id="label-repeat">
                    <span class="input-title">Repeat Password</span>
                    <span class="correct correctRepeatPassword">Repeat Password is correct</span>
                    <span class="uncorrect uncorrectRepeatPassword">Repeat Password is uncorrect</span>
                    <input type="password" id="repeat-password" class="input" placeholder="User_123&45">
                </label>
                <label class="label-checkbox" id="label-checkbox">
                    <input type="checkbox" class="checkbox" id="checkbox">
                    <span class="checkbox-title">Agree to our Terms of Service and Privacy Statement</span>
                </label>
                <div class="footer-form">
                    <button type="button" class="btn" id="btnSignIn" >Sign Up</button>
                    <a href="#" class="login-link" id="login">Already have an account?</a>
                </div>
            </form>
        </div>
        <div class="main-img" style="background-image: url('images/image 3.png');">
            <img src="images/image%202.png" alt="main-img" class="space-img">
            <div class="ellipse ellipse-1"></div>
            <div class="ellipse ellipse-2"></div>
            <div class="ellipse ellipse-3"></div>
        </div>
    </div>
</main>


<script src="scripts/script.js"></script>
</body>
</html>
